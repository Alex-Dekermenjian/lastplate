
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Create Food Offer - LastPlate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .error {
            color: #b00020;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .draft {
            background: #e5e7eb;
        }

        .publish {
            background: #228b5a;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>
            {% if listing %}
                Edit Food Offer
            {% else %}
                Create Food Offer
            {% endif %}
        </h1>

        <p>Enter the details of your discounted food offer.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="actions">
                <button type="submit"
                        name="action"
                        value="draft"
                        class="draft">
                    Save Draft
                </button>

                <button type="submit"
                        name="action"
                        value="publish"
                        class="publish">
                    Publish Offer
                </button>
            </div>
        </form>

    </div>
</body>
</html>
