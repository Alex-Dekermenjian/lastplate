{% extends "base.html" %}

{% block title %}Sign in — LastPlate{% endblock %}

{% block content %}
<section class="card">
  <h1>Sign in</h1>
  <p class="muted">Welcome back. Sign in to manage your shop.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% include "frontend/_form.html" %}
    <button class="button button--primary button--block" type="submit">Sign in</button>
  </form>
  <p class="muted" style="margin-top: 16px;">New to LastPlate? <a href="{% url 'register' %}">Register your shop</a></p>
</section>
{% endblock %}
