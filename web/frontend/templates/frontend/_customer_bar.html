{% comment %}LP-18: the customer's bottom bar. Shown by base.html to signed-in customers only.{% endcomment %}
{% with page=request.resolver_match.url_name %}
<nav class="bottom-bar-customer" aria-label="Customer menu">
  <a href="{% url 'browse-offers' %}"{% if page == "browse-offers" or page == "offer-detail" or page == "restaurant-detail" or page == "home" %} aria-current="page"{% endif %}>Home</a>
  <a href="{% url 'search' %}"{% if page == "search" %} aria-current="page"{% endif %}>Search</a>
  <a href="{% url 'my-orders' %}"{% if page == "my-orders" %} aria-current="page"{% endif %}>My orders</a>
  <a href="{% url 'my-account' %}"{% if page == "my-account" %} aria-current="page"{% endif %}>Profile</a>
</nav>
{% endwith %}
