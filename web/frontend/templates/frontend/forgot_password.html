{% extends "base.html" %}

{% block title %}Forgot your password? — LastPlate{% endblock %}

{% block content %}
<section class="auth">
  <div class="card">
    <h1>Forgot your password?</h1>
    <p>{{ help_text }}</p>
    <p class="muted">You'll log in with the temporary password once, then choose a new password of your own.</p>
    <a class="button button--primary button--block" href="{% url 'login' %}">Back to log in</a>
  </div>
</section>
{% endblock %}
